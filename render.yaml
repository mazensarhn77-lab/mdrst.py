services:
  - type: web
    name: mdrst
    runtime: python
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py
    healthCheckPath: /api/health
    domains:
      - mdrst.py
    envVars:
      - key: ACADEMY_DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AGENT_INTERVAL_SECONDS
        value: "300"
    disk:
      name: academy-data
      mountPath: /var/data
      sizeGB: 1
